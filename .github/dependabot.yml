version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      python-dependencies:
        patterns:
          - "*"
    # pyrefly and ruff are centrally pinned in nos-tromo/.github/configs/
    # python-strict/ and mirrored into pyproject.toml; the strict-config CI
    # check fails on any local drift. They move only when the canonical
    # config moves (manual re-mirror), never via an automated bump here.
    ignore:
      - dependency-name: "pyrefly"
      - dependency-name: "ruff"
      # qdrant-client is capped <1.19 in pyproject.toml: 1.19.0 relocated
      # IDF_EMBEDDING_MODELS from qdrant_client.qdrant_fastembed to
      # qdrant_client.fastembed_common, and llama-index-vector-stores-qdrant
      # 0.10.2 (the latest, predating that release) imports it from the old
      # path at module scope — so the bump is not a lint problem but an
      # ImportError that takes `docint.core.rag` down with it. Lift once
      # llama-index-vector-stores-qdrant ships a release that imports from
      # the new path.
      - dependency-name: "qdrant-client"
        versions: [">= 1.19.0"]

  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    groups:
      # react and react-dom are separate npm packages that React 19 requires
      # to be at the *exact* same version — react-dom throws "Incompatible
      # React versions" from its client entrypoint otherwise, which fails
      # every test file that renders. Ungrouped, Dependabot proposes them as
      # independent bumps, so whichever lands first is red by construction:
      # it cost #220 two hand-written follow-up commits and recurred on #442.
      # @types/* are listed so the type surface moves with the runtime it
      # describes; the patterns are exact names, so react-router-dom,
      # react-markdown and friends keep their own individual PRs.
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"

  - package-ecosystem: "docker"
    directory: "/docker"
    schedule:
      interval: "weekly"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
