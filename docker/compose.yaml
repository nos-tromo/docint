name: docint

##########################################################
# Shared backend fragments (YAML anchors)
##########################################################
x-no-proxy-env: &no-proxy-env
  NO_PROXY: "backend,qdrant,localhost,127.0.0.1,172.16.0.0/12,10.0.0.0/8${EXTRA_NO_PROXY:-}"
  no_proxy: "backend,qdrant,localhost,127.0.0.1,172.16.0.0/12,10.0.0.0/8${EXTRA_NO_PROXY:-}"

x-env-file: &env-file
  - ../.env

##########################################################
# Shared logging — the local driver rotates and compresses
# per-container; tail with `docker compose logs -f <svc>`.
##########################################################
x-logging: &default-logging
  driver: "local"
  options:
    max-size: "50m"
    max-file: "5"
    compress: "true"

##########################################################
# Shared hardening (deploy ADR 0001) — no privilege
# escalation, no capabilities; both images run non-root
# with read-only root filesystems.
##########################################################
x-hardened: &hardened
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

services:
  ##########################################################
  # Backend
  #
  # Single image, CPU-only Python. All ML inference (chat,
  # embeddings, rerank, NER, CLIP) is delegated over HTTP to
  # the external vllm-service stack — see CLAUDE.md.
  ##########################################################
  backend:
    <<: *hardened
    image: docint-backend:${DOCINT_VERSION:-latest}
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    logging: *default-logging
    # Uploads spool through /tmp (starlette) before landing in
    # QDRANT_SRC_DIR, so the tmpfs must exceed DOCINT_CLIENT_MAX_BODY_SIZE.
    read_only: true
    tmpfs:
      - /tmp:size=2g
    expose:
      - "8000"
    environment:
      <<: *no-proxy-env
      NEXTEXT_API_BASE: ${NEXTEXT_API_BASE:-http://nextext-backend:8000/api/v1}
      RESPONSE_LANGUAGE: ${RESPONSE_LANGUAGE:-en}
      QDRANT_HOST: http://qdrant:6333
      QDRANT_SRC_DIR: /var/lib/docint/sources
      SESSIONS_DB_PATH: /var/lib/docint/sessions/sessions.sqlite3
      # Volume-backed pipeline paths (deploy ADR 0001): the defaults derive
      # from $HOME, which is read-only for the non-root user — every runtime
      # write must land on a volume or /tmp.
      DATA_PATH: /var/lib/docint/pipeline/data
      PIPELINE_ARTIFACTS_DIR: /var/lib/docint/pipeline/artifacts
      RESULTS_PATH: /var/lib/docint/pipeline/results
      # Explicit (matches the volume mount) rather than derived from $HOME.
      HF_HUB_CACHE: /home/app/.cache/huggingface/hub
      # Same value nginx enforces (frontend service, below). The backend only
      # advertises it via GET /config so the SPA sizes upload batches to stay
      # under nginx's client_max_body_size; it does not enforce it here.
      DOCINT_CLIENT_MAX_BODY_SIZE: ${DOCINT_CLIENT_MAX_BODY_SIZE:-1g}
    env_file: *env-file
    volumes:
      - docling-cache:/home/app/.cache/docling
      - huggingface-cache:/home/app/.cache/huggingface/hub
      - sessions-storage:/var/lib/docint/sessions
      - source-preview-cache:/var/lib/docint/sources
      - pipeline-storage:/var/lib/docint/pipeline
    networks:
      docint-net:
        aliases:
          - backend
      data-net:
        aliases:
          - docint-backend
      inference-net:
        aliases:
          - docint-backend
    healthcheck:
      # Liveness: uvicorn serving /version is exactly when the frontend can
      # safely proxy. Dependency-free (no qdrant/model access); python3 urllib
      # avoids adding curl to the image. start_interval marks it healthy ~5s
      # after boot (Docker >=25) instead of at the first 30s probe.
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/version').read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
      start_interval: 3s
    restart: unless-stopped

  ##########################################################
  # Frontend SPA – nginx serves the React build and reverse-
  # proxies API routes to the backend on the docint-net network.
  ##########################################################
  frontend:
    <<: *hardened
    image: docint-frontend:${DOCINT_VERSION:-latest}
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    logging: *default-logging
    # nginx (unprivileged image) writes pid/temp under /tmp; the envsubst
    # entrypoint renders the template into /etc/nginx/conf.d at startup
    # (mode=1777: the tmpfs shadows the image dir root-owned).
    read_only: true
    tmpfs:
      - /tmp:size=16m
      - /etc/nginx/conf.d:size=1m,mode=1777
    environment:
      DOCINT_CLIENT_MAX_BODY_SIZE: ${DOCINT_CLIENT_MAX_BODY_SIZE:-1g}
    networks:
      docint-net:
        aliases:
          - frontend
      edge-net:
        aliases:
          - docint-frontend
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

##########################################################
# Volumes
##########################################################
volumes:
  docling-cache:
    external: true
  huggingface-cache:
    external: true
  ollama-cache:
    external: true
  sessions-storage:
    external: true
  source-preview-cache:
    external: true
  pipeline-storage:
    external: true

##########################################################
# Networks
##########################################################
networks:
  docint-net:
  data-net:
    external: true
    name: ${DATA_NET:-data-net}
  inference-net:
    external: true
    name: ${INFERENCE_NET:-inference-net}
  edge-net:
    external: true
    name: ${EDGE_NET:-edge-net}
