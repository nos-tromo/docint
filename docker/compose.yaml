name: docint

##########################################################
# Shared backend fragments (YAML anchors)
##########################################################
x-no-proxy-env: &no-proxy-env
  NO_PROXY: "backend,qdrant,localhost,127.0.0.1,172.16.0.0/12,10.0.0.0/8${EXTRA_NO_PROXY:-}"
  no_proxy: "backend,qdrant,localhost,127.0.0.1,172.16.0.0/12,10.0.0.0/8${EXTRA_NO_PROXY:-}"

x-env-file: &env-file
  - ../.env

##########################################################
# Shared logging — the local driver rotates and compresses
# per-container; tail with `docker compose logs -f <svc>`.
##########################################################
x-logging: &default-logging
  driver: "local"
  options:
    max-size: "50m"
    max-file: "5"
    compress: "true"

##########################################################
# Shared hardening (deploy ADR 0001) — no privilege
# escalation, no capabilities; both images run non-root
# with read-only root filesystems.
##########################################################
x-hardened: &hardened
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

services:
  ##########################################################
  # Volume ownership (deploy ADR 0001 runbook, automated)
  #
  # The backend runs as uid 10001 with a read-only rootfs, but external
  # volumes keep whatever ownership they were created with (root, on a
  # fresh `docker volume create`) — image-build chowns cannot help, since
  # the volume mount shadows the image path at runtime. This one-shot
  # root container fixes ownership before the backend starts; it reuses
  # the backend image so the airgap bundle needs no extra image. The
  # find form only touches wrong-owner entries, so a boot over an
  # already-owned multi-GB huggingface-cache writes nothing.
  ##########################################################
  volume-permissions:
    image: docint-backend:${DOCINT_VERSION:-latest}
    logging: *default-logging
    user: "0:0"
    read_only: true
    security_opt:
      - no-new-privileges:true
    network_mode: none
    # Roots are the five mountpoints themselves — their parent dirs live on
    # the read-only image rootfs and must not (and cannot) be chowned.
    # The second find sweeps the media-tmp upload spool: starlette unlinks
    # its /tmp spool files only on clean request teardown, so a crash or
    # restart mid-upload strands them, and a disk-backed named volume (unlike
    # the tmpfs it replaced) has no size cap and survives restarts. Nothing
    # is in flight before the backend starts, so a boot-time wipe restores
    # the tmpfs's clean-on-start property.
    entrypoint:
      - /bin/sh
      - -c
      - >-
        find /var/lib/docint/sessions /var/lib/docint/sources
        /var/lib/docint/pipeline /home/app/.cache/docling
        /home/app/.cache/huggingface/hub
        -xdev ! -user 10001 -exec chown -h 10001:10001 {} +
        &&
        find /cleanup/media-tmp -xdev -mindepth 1 -delete
    volumes:
      - docling-cache:/home/app/.cache/docling
      - huggingface-cache:/home/app/.cache/huggingface/hub
      - sessions-storage:/var/lib/docint/sessions
      - source-preview-cache:/var/lib/docint/sources
      - pipeline-storage:/var/lib/docint/pipeline
      - media-tmp:/cleanup/media-tmp
    restart: "no"

  ##########################################################
  # Backend
  #
  # Single image, CPU-only Python. All ML inference (chat,
  # embeddings, rerank, NER, CLIP) is delegated over HTTP to
  # the external vllm-service stack — see CLAUDE.md.
  ##########################################################
  backend:
    <<: *hardened
    image: docint-backend:${DOCINT_VERSION:-latest}
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    logging: *default-logging
    # Uploads spool through /tmp (starlette) before landing in
    # QDRANT_SRC_DIR, so /tmp must hold whole request bodies (up to
    # DOCINT_CLIENT_MAX_BODY_SIZE, concurrently). A RAM tmpfs sized for that
    # would eat host memory, so it is a disk-backed scratch volume
    # (media-tmp, in `volumes:` below) instead — mirroring vllm-service's
    # asr/diarize/vad/router; it never holds durable state and `down -v`
    # may delete it. volume-permissions wipes it before each backend start,
    # so spool files orphaned by a crash mid-upload cannot accumulate.
    read_only: true
    expose:
      - "8000"
    environment:
      <<: *no-proxy-env
      NEXTEXT_API_BASE: ${NEXTEXT_API_BASE:-http://nextext-backend:8000/api/v1}
      RESPONSE_LANGUAGE: ${RESPONSE_LANGUAGE:-en}
      QDRANT_HOST: http://qdrant:6333
      QDRANT_SRC_DIR: /var/lib/docint/sources
      SESSIONS_DB_PATH: /var/lib/docint/sessions/sessions.sqlite3
      # Volume-backed pipeline paths (deploy ADR 0001): the defaults derive
      # from $HOME, which is read-only for the non-root user — every runtime
      # write must land on a volume or /tmp.
      DATA_PATH: /var/lib/docint/pipeline/data
      PIPELINE_ARTIFACTS_DIR: /var/lib/docint/pipeline/artifacts
      RESULTS_PATH: /var/lib/docint/pipeline/results
      EXTRACT_DIR: /var/lib/docint/pipeline/extracts
      # Explicit (matches the volume mount) rather than derived from $HOME.
      HF_HUB_CACHE: /home/app/.cache/huggingface/hub
      # Same value nginx enforces (frontend service, below). The backend only
      # advertises it via GET /config so the SPA sizes upload batches to stay
      # under nginx's client_max_body_size; it does not enforce it here.
      DOCINT_CLIENT_MAX_BODY_SIZE: ${DOCINT_CLIENT_MAX_BODY_SIZE:-1g}
    env_file: *env-file
    volumes:
      - docling-cache:/home/app/.cache/docling
      - huggingface-cache:/home/app/.cache/huggingface/hub
      - sessions-storage:/var/lib/docint/sessions
      - source-preview-cache:/var/lib/docint/sources
      - pipeline-storage:/var/lib/docint/pipeline
      # Upload spool (see the read_only comment above). A fresh volume copies
      # the image's /tmp mode (1777), so the non-root user can write without
      # a chown step in volume-permissions.
      - media-tmp:/tmp
    networks:
      docint-net:
        aliases:
          - backend
      data-net:
        aliases:
          - docint-backend
      inference-net:
        aliases:
          - docint-backend
    healthcheck:
      # Liveness: uvicorn serving /version is exactly when the frontend can
      # safely proxy. Dependency-free (no qdrant/model access); python3 urllib
      # avoids adding curl to the image. start_interval marks it healthy ~5s
      # after boot (Docker >=25) instead of at the first 30s probe.
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/version').read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
      start_interval: 3s
    depends_on:
      volume-permissions:
        condition: service_completed_successfully
    restart: unless-stopped

  ##########################################################
  # Frontend SPA – nginx serves the React build and reverse-
  # proxies API routes to the backend on the docint-net network.
  ##########################################################
  frontend:
    <<: *hardened
    image: docint-frontend:${DOCINT_VERSION:-latest}
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    logging: *default-logging
    # nginx (unprivileged image) writes pid/temp under /tmp; the envsubst
    # entrypoint renders the template into /etc/nginx/conf.d at startup
    # (mode=1777: the tmpfs shadows the image dir root-owned).
    read_only: true
    tmpfs:
      - /tmp:size=16m
      - /etc/nginx/conf.d:size=1m,mode=1777
    environment:
      DOCINT_CLIENT_MAX_BODY_SIZE: ${DOCINT_CLIENT_MAX_BODY_SIZE:-1g}
      # Frontend only, unlike the upload limit above: nginx enforces this one
      # and nothing advertises it. The SPA is bounded by the item count the
      # backend advertises (REPORT_BATCH_MAX_ITEMS), not by these bytes.
      DOCINT_API_MAX_BODY_SIZE: ${DOCINT_API_MAX_BODY_SIZE:-64m}
    networks:
      docint-net:
        aliases:
          - frontend
      edge-net:
        aliases:
          - docint-frontend
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

##########################################################
# Volumes
##########################################################
volumes:
  docling-cache:
    external: true
  huggingface-cache:
    external: true
  ollama-cache:
    external: true
  sessions-storage:
    external: true
  source-preview-cache:
    external: true
  pipeline-storage:
    external: true
  # Upload spool (backend /tmp) — disk-backed scratch, never durable state.
  # Compose-managed (not external): safe to recreate at any time.
  media-tmp:

##########################################################
# Networks
##########################################################
networks:
  docint-net:
  data-net:
    external: true
    name: ${DATA_NET:-data-net}
  inference-net:
    external: true
    name: ${INFERENCE_NET:-inference-net}
  edge-net:
    external: true
    name: ${EDGE_NET:-edge-net}
