# Shared security headers. Included from every location block that itself sets
# any header (because add_header at server scope is dropped once a location
# defines its own headers — nginx replaces, never merges).
#
# img-src and frame-src admit blob: because the SPA fetches every file it shows
# (thumbnails, previews — an <img src> or <iframe src> could not send the
# stated purpose, X-Audit-Purpose) and shows it from an object URL it created
# itself. Scripts stay 'self' only, and a document the SPA opens from a blob
# inherits this policy. No route is framable: the SPA frames only its own
# blobs, and frame-ancestors governs network responses, not those.

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; frame-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
