# Same-origin-framable variant of security-headers.conf, for the one route
# the SPA renders inside its own iframe (the in-page source preview dialog).
# DENY / frame-ancestors 'none' forbid rendering in *any* frame, including the
# app's own — observed as the browser's blocked-page icon for PDF/JSON
# previews while a new tab worked, since neither header constrains top-level
# navigation. SAMEORIGIN / 'self' keep third-party sites from embedding the
# documents. Everything else mirrors security-headers.conf; keep them in sync.

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
