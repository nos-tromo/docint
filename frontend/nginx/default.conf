
# Proxy target URI: strip the /docint prefix from the RAW request URI so
# percent-encoding survives ($uri would arrive decoded and un-re-encoded;
# $request_uri would keep the prefix the backend doesn't know).
# $request_uri includes the query string, so no $is_args$args needed.
map $request_uri $proxy_uri {
    ~^/docint(?<rest>/.+)$ $rest;
    default $request_uri;
}

# `/ingest` is two different things depending on the method: the SPA's ingest
# screen, which a browser navigates to, and the CLI/batch endpoint that ingests
# the server's own DATA_PATH (`POST /ingest`). The API location below claims the
# whole prefix, so opening or reloading /docint/ingest was answered by FastAPI
# — "405 Method Not Allowed" — instead of the app. Only the bare path is
# ambiguous; everything under /ingest/ (upload, finalize, jobs, the SSE stream)
# is API-only and must keep proxying.
map "$request_method:$uri" $ingest_spa_page {
    "GET:/ingest"    1;
    "HEAD:/ingest"   1;
    # With the trailing slash the router still matches, and no API endpoint
    # lives there, so it may as well resolve to the page too.
    "GET:/ingest/"   1;
    "HEAD:/ingest/"  1;
    default          "";
}

server {
    # 8080: the unprivileged nginx image runs as uid 101 and cannot bind
    # ports below 1024 (deploy ADR 0001).
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    # Defer upstream DNS resolution to request time via Docker's embedded
    # resolver. Without this, nginx resolves "backend" at config-load time
    # and crashes if the backend container is not yet up (or its IP later
    # changes after a restart).
    resolver 127.0.0.11 valid=30s ipv6=off;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml application/xml font/woff2;

    # Canonical sub-path: strip the /docint prefix so the existing
    # root-anchored locations below apply unchanged. (/.+ not /.*: the
    # bare prefix must fall through to the SPA fallback, not rewrite to
    # "/" and loop through the redirect below.)
    rewrite ^/docint(/.+)$ $1;

    location = / {
        return 302 /docint/;
    }

    # ---- Source preview: the one response the SPA frames itself ----
    # The in-page preview dialog renders this route in a same-origin iframe.
    # The shared headers' DENY / frame-ancestors 'none' forbid that (they
    # block rendering in any frame while leaving new-tab navigation alone),
    # so this exact-match location — which beats the API regex below — serves
    # the same proxy with the SAMEORIGIN variant instead.
    location = /sources/preview {
        set $backend_upstream "backend:8000";
        proxy_pass http://$backend_upstream$proxy_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        include /etc/nginx/security-headers-framable.conf;
    }

    # ---- Backend API: JSON endpoints (proxied to FastAPI) ----
    # Excludes the SSE endpoints below by listing them first via more-specific
    # locations (exact match `=` and prefix `^~` beat regex locations).
    location ~ ^/(collections|sessions|reports|sources|query|search|summarize|agent|config|version|health|whoami|docs|openapi\.json|redoc|translate)(/|$) {
        set $backend_upstream "backend:8000";
        proxy_pass http://$backend_upstream$proxy_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # JSON bodies are small here bar one: a full report batch add is
        # single-digit MB, well past nginx's 1m default. Its own variable
        # rather than the 1g upload ceiling below.
        client_max_body_size ${DOCINT_API_MAX_BODY_SIZE};
        proxy_http_version 1.1;
        # Stream the body instead of spooling it to the 16m /tmp tmpfs — see
        # the ingest location below for the full rationale.
        proxy_request_buffering off;
        include /etc/nginx/security-headers.conf;
    }

    # ---- Backend API: streaming (SSE) ----
    # gzip stays off (SSE is not in gzip_types but explicit is safer),
    # proxy_buffering off so each token frame flushes to the client, and
    # proxy_request_buffering off so the JSON request body forwards without
    # waiting for the full body — none of these requests are big enough to
    # justify request buffering.
    location = /stream_query {
        set $backend_upstream "backend:8000";
        proxy_pass http://$backend_upstream$proxy_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        gzip off;
        include /etc/nginx/security-headers.conf;
    }

    # ---- Backend API: ingestion (large uploads + SSE) ----
    location ~ ^/ingest(/|$) {
        # A browser navigating to the ingest screen gets the SPA shell, not the
        # backend. `if` is safe here because it contains nothing but `return` —
        # the one form nginx documents as unconditionally sound — and the
        # error_page hands that case to a named location.
        error_page 418 = @spa_shell;
        if ($ingest_spa_page) {
            return 418;
        }

        set $backend_upstream "backend:8000";
        proxy_pass http://$backend_upstream$proxy_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # This applies to the whole multipart request, not each file.
        client_max_body_size ${DOCINT_CLIENT_MAX_BODY_SIZE};
        proxy_http_version 1.1;
        proxy_buffering off;
        # Stream the upload body straight to the backend instead of spooling
        # it to /tmp first: the container's /tmp is a small tmpfs (16m in
        # compose), far below client_max_body_size, so a buffered upload
        # larger than the tmpfs 500s on "no space left on device". The
        # backend spools the body itself (starlette), so nothing is lost.
        proxy_request_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        gzip off;
        include /etc/nginx/security-headers.conf;
    }

    # ---- Hashed assets: immutable long-lived cache ----
    location /assets/ {
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/security-headers.conf;
        try_files $uri =404;
    }

    # ---- SPA shell, reachable from a location that must not serve it directly ----
    # Same response as the fallback below; it exists because a location whose
    # job is to proxy cannot also try_files its way out.
    location @spa_shell {
        add_header Cache-Control "no-cache, must-revalidate" always;
        include /etc/nginx/security-headers.conf;
        try_files /index.html =404;
    }

    # ---- SPA shell: never cache, fall back to index.html for client routes ----
    location / {
        add_header Cache-Control "no-cache, must-revalidate" always;
        include /etc/nginx/security-headers.conf;
        try_files $uri $uri/ /index.html;
    }
}
