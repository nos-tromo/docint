[project]
name = "docint"
version = "2.4.1"
description = "Proof of concept RAG application"
authors = [
  { name = "nos-tromo" }
]
requires-python = ">=3.11,<3.12"
license = "Apache-2.0"
dependencies = [
  "cryptography>=50.0.1",
  # docling-slim = docling WITHOUT the [standard] extra, whose docling-ibm-models
  # dependency drags in torch + the full NVIDIA CUDA stack (~4.5 GB) that this
  # CPU-only, remote-inference image must not ship. The extras docint actually
  # uses are declared directly below: docling-core[chunking] (DoclingNodeParser),
  # docling-parse (also the PDF pipeline's text/geometry backbone, see
  # core/readers/documents/parse.py) + rtree + scipy (imported eagerly by
  # docling.document modules),
  # python-docx (docling's DOCX backend), openpyxl (pandas read_excel).
  "docling-core[chunking]>=2.92.0",
  "docling-parse>=7.16.0",
  "docling-slim>=2.123.1",
  "fastapi>=0.141.1",
  "fastparquet>=2026.5.0",
  "httpx>=0.28.1",
  "huggingface-hub>=1.29.0,<2.0",
  "llama-index>=0.14.24",
  "llama-index-embeddings-openai>=0.6.0",
  "llama-index-llms-openai>=0.7.10",
  "llama-index-node-parser-docling>=0.4.2",
  "llama-index-vector-stores-qdrant>=0.10.3",
  "loguru>=0.7.3",
  "markdown-it-py>=4.2.0",
  "numpy>=2.3.5",
  "openai>=2.53.0",
  "openpyxl>=3.1.5",
  "pandas>=3.0.5",
  "pillow>=12.3.0",
  "prometheus-fastapi-instrumentator>=8.1.0",
  "pydantic>=2.13.5",
  "pypdfium2>=5.13.0",  # page rasterisation (vision OCR) + embedded-image pixels in core/readers/documents/
  "python-docx>=1.2.0",
  "python-dotenv>=1.2.3",
  "python-magic>=0.4.27",
  "python-multipart>=0.0.32",
  "qdrant-client>=1.18.0,<1.19",  # 1.19 moved IDF_EMBEDDING_MODELS out of qdrant_fastembed; see dependabot.yml
  "requests>=2.34.2",
  "rtree>=1.0",
  "scipy>=1.6.0",
  "sqlalchemy>=2.0.52",
  "striprtf>=0.0.33",
  "transformers>=5.10.0",  # CVE-2026-9856; docling-core's <5.9 cap is darwin-only, see [tool.uv] environments
  "uvicorn>=0.52.4",
  "weasyprint>=69.0",
]

[project.urls]
Repository = "https://github.com/nos-tromo/docint.git"

[project.scripts]
docint = "docint.cli.serve:main"
ingest = "docint.cli.ingest:main"
resolve = "docint.cli.resolve:main"
extract = "docint.cli.extract:main"
search-index = "docint.cli.search_index:main"
search-index-all = "docint.cli.search_index:main_all"
query = "docint.cli.query:main"
query-eval = "docint.cli.eval:main"
verify = "docint.cli.verify:main"
load-models = "docint.utils.model_cfg:main"

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pyrefly==1.1.1",
    "pytest>=9.1.1",
    "ruff==0.15.14",
]

[build-system]
requires = ["setuptools>=84.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["docint*"]

[tool.ruff]
# Mirrors nos-tromo/.github/configs/python-strict/ruff.toml. target-version
# is the only key that may differ (docint floors at py311). Drift fails CI.
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = [
    "E", "F", "W",
    "I",
    "B",
    "D",
    "ANN",
    "UP",
    "RUF",
]
ignore = ["ANN401"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pyrefly]
# Mirrors nos-tromo/.github/configs/python-strict/pyrefly.toml. Drift fails CI.
preset = "strict"
ignore-missing-imports = ["*"]

[tool.uv]
package = true
# The lock is resolved for Linux only. docling-core[chunking] caps transformers
# <5.9 on darwin but allows <6.0 everywhere else, so a lock that also covers
# macOS forks the resolution and keeps the CVE-2026-9856 version (5.8.1) in
# uv.lock forever. docint runs on Debian-slim in Docker and CI runs on Linux;
# `uv sync` on macOS will refuse this lock. See docs/development.md.
environments = ["sys_platform == 'linux'"]
# nltk >=3.10.3 refuses hardlinked data files (st_nlink>1); see docs/development.md.
link-mode = "copy"
